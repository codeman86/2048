name: Desktop

on:
  push:
  pull_request:

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject remote URLs in the desktop frontend
        run: bash desktop/scripts/check-offline.sh

      - name: Build AppImage
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Repack AppImage with library preflight
        run: bash desktop/src-tauri/appimage/repack.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: 2048-linux-appimage
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
