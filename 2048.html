<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Gridline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --charcoal: #07100b;
      --panel: rgba(4, 20, 12, 0.88);
      --panel-strong: rgba(8, 37, 22, 0.94);
      --grid: #0b2d1b;
      --neon: #39ff88;
      --neon-soft: rgba(57, 255, 136, 0.26);
      --neon-mid: rgba(57, 255, 136, 0.52);
      --text: #e8fff2;
      --muted: #8ccfaa;
      --danger: #ff4f7b;
      --tile-empty: rgba(13, 55, 32, 0.62);
      --radius: 8px;
      --board-size: min(88vw, 520px);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(57, 255, 136, 0.11), transparent 34%),
        linear-gradient(180deg, var(--charcoal) 0%, var(--bg) 42%, #000 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
    }

    .game-shell {
      width: min(100%, 640px);
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 22px;
    }

    .hud {
      min-width: 0;
      text-align: center;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.6rem, 13vw, 7.4rem);
      line-height: 0.86;
      letter-spacing: 0;
      color: #f2fff7;
      text-shadow:
        0 0 8px rgba(57, 255, 136, 0.75),
        0 0 28px rgba(57, 255, 136, 0.45),
        0 0 64px rgba(57, 255, 136, 0.22);
    }

    .subtitle {
      max-width: 31rem;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin: 18px auto 22px;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 150px));
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .score-box {
      border: 1px solid var(--neon-mid);
      background: linear-gradient(180deg, rgba(57, 255, 136, 0.14), rgba(2, 10, 6, 0.7));
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: inset 0 0 18px rgba(57, 255, 136, 0.08), 0 0 20px rgba(57, 255, 136, 0.1);
    }

    .score-label {
      color: var(--muted);
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score-value {
      display: block;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.05;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--neon);
      border-radius: var(--radius);
      background: rgba(4, 18, 11, 0.92);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      min-height: 44px;
      padding: 0 18px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: 0 0 18px rgba(57, 255, 136, 0.18), inset 0 0 12px rgba(57, 255, 136, 0.08);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    button:hover,
    button:focus-visible {
      background: rgba(57, 255, 136, 0.15);
      box-shadow: 0 0 26px rgba(57, 255, 136, 0.34), inset 0 0 16px rgba(57, 255, 136, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .board-panel {
      position: relative;
      border: 1px solid var(--neon-mid);
      border-radius: 14px;
      background: var(--panel);
      padding: clamp(12px, 2.2vw, 20px);
      box-shadow:
        0 0 0 1px rgba(57, 255, 136, 0.08),
        0 0 36px rgba(57, 255, 136, 0.17),
        inset 0 0 44px rgba(57, 255, 136, 0.07);
      width: fit-content;
    }

    .board-panel::before,
    .board-panel::after {
      content: "";
      position: absolute;
      width: 38%;
      height: 1px;
      background: var(--neon);
      box-shadow: 0 0 12px var(--neon);
      pointer-events: none;
    }

    .board-panel::before {
      left: 18px;
      top: -1px;
    }

    .board-panel::after {
      right: 18px;
      bottom: -1px;
    }

    .board {
      --board-gap: clamp(8px, 1.8vw, 14px);
      --board-pad: clamp(8px, 1.8vw, 14px);
      width: var(--board-size);
      height: var(--board-size);
      max-width: 100%;
      max-height: calc(100vh - 72px);
      aspect-ratio: 1;
      position: relative;
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(57, 255, 136, 0.08), transparent 38%),
        var(--grid);
      padding: var(--board-pad);
      touch-action: none;
      user-select: none;
    }

    .cells,
    .tile-layer {
      position: absolute;
      inset: var(--board-pad);
    }

    .cells {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--board-gap);
    }

    .cell {
      background: var(--tile-empty);
      border: 1px solid rgba(57, 255, 136, 0.14);
      border-radius: 8px;
      box-shadow: inset 0 0 14px rgba(57, 255, 136, 0.04);
    }

    .tile-layer {
      pointer-events: none;
      z-index: 2;
    }

    .tile {
      --cell-size: calc((100% - (var(--board-gap) * 3)) / 4);
      height: var(--cell-size);
      left: 0;
      position: absolute;
      top: 0;
      transition: transform 165ms cubic-bezier(0.22, 0.78, 0.22, 1);
      width: var(--cell-size);
      will-change: transform;
    }

    .tile.no-transition {
      transition: none;
    }

    .tile-inner {
      align-items: center;
      background: #0a3b24;
      border: 1px solid rgba(57, 255, 136, 0.14);
      border-radius: 8px;
      color: var(--text);
      display: flex;
      font-size: clamp(1.35rem, 7vw, 3.4rem);
      font-weight: 900;
      height: 100%;
      justify-content: center;
      line-height: 1;
      min-width: 0;
      overflow: hidden;
      position: relative;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.28);
      transition: background 120ms ease, box-shadow 120ms ease;
      width: 100%;
    }

    .tile.new .tile-inner {
      animation: spawn 190ms cubic-bezier(0.18, 0.88, 0.32, 1.18);
    }

    .tile.merge .tile-inner {
      animation: pulse 220ms cubic-bezier(0.18, 0.88, 0.32, 1.18);
    }

    .tile[data-value="2"] .tile-inner { background: #0a3b24; box-shadow: inset 0 0 14px rgba(57,255,136,.08); }
    .tile[data-value="4"] .tile-inner { background: #0b4a2b; box-shadow: inset 0 0 16px rgba(57,255,136,.1); }
    .tile[data-value="8"] .tile-inner { background: #0d5d35; box-shadow: 0 0 12px rgba(57,255,136,.12), inset 0 0 18px rgba(57,255,136,.12); }
    .tile[data-value="16"] .tile-inner { background: #0f7441; box-shadow: 0 0 16px rgba(57,255,136,.16), inset 0 0 20px rgba(57,255,136,.14); }
    .tile[data-value="32"] .tile-inner { background: #12894d; box-shadow: 0 0 20px rgba(57,255,136,.2), inset 0 0 22px rgba(57,255,136,.16); }
    .tile[data-value="64"] .tile-inner { background: #14a05b; box-shadow: 0 0 24px rgba(57,255,136,.24), inset 0 0 24px rgba(57,255,136,.2); }
    .tile[data-value="128"] .tile-inner { background: #16b668; font-size: clamp(1.15rem, 6vw, 2.8rem); box-shadow: 0 0 28px rgba(57,255,136,.3); }
    .tile[data-value="256"] .tile-inner { background: #18cb74; font-size: clamp(1.15rem, 6vw, 2.8rem); box-shadow: 0 0 34px rgba(57,255,136,.36); }
    .tile[data-value="512"] .tile-inner { background: #1be782; color: #021107; font-size: clamp(1.15rem, 6vw, 2.8rem); box-shadow: 0 0 40px rgba(57,255,136,.44); }
    .tile[data-value="1024"] .tile-inner { background: #7cffb3; color: #021107; font-size: clamp(0.95rem, 5vw, 2.35rem); box-shadow: 0 0 46px rgba(124,255,179,.5); }
    .tile[data-value="2048"] .tile-inner { background: #eafff2; color: #031209; font-size: clamp(0.95rem, 5vw, 2.35rem); box-shadow: 0 0 58px rgba(234,255,242,.64); }

    .message {
      position: absolute;
      inset: clamp(12px, 2.2vw, 20px);
      align-items: center;
      background: rgba(1, 9, 5, 0.88);
      border: 1px solid var(--neon);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 5;
    }

    .message.show {
      display: flex;
    }

    .message strong {
      color: var(--neon);
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
      text-shadow: 0 0 24px var(--neon-mid);
      text-transform: uppercase;
    }

    .message span {
      color: var(--muted);
      margin: 12px 0 20px;
    }

    @keyframes spawn {
      from { opacity: 0; transform: scale(0.72); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      55% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media (max-width: 820px) {
      body {
        align-items: start;
        padding-top: 20px;
      }

      .game-shell {
        gap: 18px;
      }

      .subtitle {
        margin: 16px 0 20px;
      }

      .scores {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .board-panel {
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="2048 Gridline game">
    <section class="hud">
      <h1>2048</h1>
      <p class="subtitle">Slide matching cells through the green circuit grid. Build the 2048 tile before the board locks.</p>

      <div class="scores" aria-live="polite">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Best</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" id="newGame">New Game</button>
        <button type="button" id="keepPlaying">Keep Playing</button>
      </div>
    </section>

    <section class="board-panel">
      <div class="board" id="board" role="grid" aria-label="2048 board">
        <div class="cells" id="cells"></div>
        <div class="tile-layer" id="tileLayer"></div>
      </div>
      <div class="message" id="message" aria-live="assertive">
        <strong id="messageTitle">Game Over</strong>
        <span id="messageText">No more moves remain.</span>
        <button type="button" id="messageButton">Restart</button>
      </div>
    </section>
  </main>

  <script>
    const size = 4;
    const moveDuration = 165;
    const storageKey = "tron-2048-best";
    const boardElement = document.getElementById("board");
    const cellsElement = document.getElementById("cells");
    const tileLayer = document.getElementById("tileLayer");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const messageElement = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");
    const messageButton = document.getElementById("messageButton");
    const newGameButton = document.getElementById("newGame");
    const keepPlayingButton = document.getElementById("keepPlaying");
    const nextFrame = window.requestAnimationFrame || ((callback) => window.setTimeout(callback, 16));

    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem(storageKey)) || 0;
    let won = false;
    let gameOver = false;
    let animating = false;
    let touchStart = null;

    bestElement.textContent = best;

    for (let index = 0; index < size * size; index += 1) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("role", "presentation");
      cellsElement.appendChild(cell);
    }

    function createEmptyBoard() {
      return Array.from({ length: size }, () => Array(size).fill(0));
    }

    function startGame() {
      board = createEmptyBoard();
      score = 0;
      won = false;
      gameOver = false;
      animating = false;
      messageElement.classList.remove("show");
      addRandomTile();
      const newCell = addRandomTile();
      renderTiles(newCell);
      updateScores();
    }

    function addRandomTile() {
      const empty = [];
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          if (board[row][col] === 0) {
            empty.push({ row, col });
          }
        }
      }

      if (!empty.length) return;
      const cell = empty[Math.floor(Math.random() * empty.length)];
      board[cell.row][cell.col] = Math.random() < 0.9 ? 2 : 4;
      return cell;
    }

    function updateScores() {
      scoreElement.textContent = score;
      bestElement.textContent = best;
    }

    function translateFor(row, col) {
      const xGap = col ? ` + ${Array(col).fill("var(--board-gap)").join(" + ")}` : "";
      const yGap = row ? ` + ${Array(row).fill("var(--board-gap)").join(" + ")}` : "";
      return `translate(calc(${col * 100}%${xGap}), calc(${row * 100}%${yGap}))`;
    }

    function positionTile(tile, row, col) {
      tile.style.transform = translateFor(row, col);
    }

    function createTile(value, row, col, className = "") {
      const tile = document.createElement("div");
      tile.className = `tile ${className}`.trim();
      tile.dataset.value = String(value);
      positionTile(tile, row, col);
      tile.setAttribute("role", "gridcell");
      tile.setAttribute("aria-label", String(value));

      const inner = document.createElement("div");
      inner.className = "tile-inner";
      inner.textContent = value;
      tile.appendChild(inner);
      return tile;
    }

    function renderTiles(newCell, mergeCells = new Set(), delayMerge = false) {
      tileLayer.innerHTML = "";
      const delayedMergeTiles = [];
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const value = board[row][col];
          if (!value) continue;

          const key = `${row}-${col}`;
          const isMerge = mergeCells.has(key);
          const classes = [
            newCell && newCell.row === row && newCell.col === col ? "new" : "",
            isMerge && !delayMerge ? "merge" : ""
          ].filter(Boolean).join(" ");

          const tile = createTile(value, row, col, classes);
          if (isMerge && delayMerge) delayedMergeTiles.push(tile);
          tileLayer.appendChild(tile);
        }
      }

      if (delayedMergeTiles.length) {
        nextFrame(() => {
          delayedMergeTiles.forEach((tile) => tile.classList.add("merge"));
        });
      }
    }

    function lineCells(direction, index) {
      const cells = [];
      for (let offset = 0; offset < size; offset += 1) {
        if (direction === "left") cells.push({ row: index, col: offset });
        if (direction === "right") cells.push({ row: index, col: size - 1 - offset });
        if (direction === "up") cells.push({ row: offset, col: index });
        if (direction === "down") cells.push({ row: size - 1 - offset, col: index });
      }
      return cells;
    }

    function buildMove(direction) {
      const next = createEmptyBoard();
      const moves = [];
      const mergeCells = new Set();
      let gained = 0;

      for (let index = 0; index < size; index += 1) {
        const cells = lineCells(direction, index);
        const tiles = cells
          .map((cell) => ({ ...cell, value: board[cell.row][cell.col] }))
          .filter((cell) => cell.value);
        let target = 0;

        for (let tileIndex = 0; tileIndex < tiles.length; tileIndex += 1) {
          const current = tiles[tileIndex];
          const destination = cells[target];

          if (tiles[tileIndex + 1] && tiles[tileIndex + 1].value === current.value) {
            const nextTile = tiles[tileIndex + 1];
            const mergedValue = current.value * 2;
            next[destination.row][destination.col] = mergedValue;
            gained += mergedValue;
            mergeCells.add(`${destination.row}-${destination.col}`);
            moves.push({ value: current.value, from: current, to: destination });
            moves.push({ value: nextTile.value, from: nextTile, to: destination });
            tileIndex += 1;
          } else {
            next[destination.row][destination.col] = current.value;
            moves.push({ value: current.value, from: current, to: destination });
          }

          target += 1;
        }
      }

      return {
        changed: JSON.stringify(next) !== JSON.stringify(board),
        gained,
        mergeCells,
        moves,
        next
      };
    }

    function animateMoves(moves) {
      tileLayer.innerHTML = "";

      moves.forEach((moveItem) => {
        const tile = createTile(moveItem.value, moveItem.from.row, moveItem.from.col, "no-transition");
        tileLayer.appendChild(tile);
        tile.offsetHeight;
        tile.classList.remove("no-transition");
        positionTile(tile, moveItem.to.row, moveItem.to.col);
      });
    }

    function move(direction) {
      if (gameOver || animating) return;

      const plannedMove = buildMove(direction);
      if (!plannedMove.changed) return;

      animating = true;
      messageElement.classList.remove("show");
      animateMoves(plannedMove.moves);

      score += plannedMove.gained;
      if (score > best) {
        best = score;
        localStorage.setItem(storageKey, String(best));
      }
      updateScores();

      window.setTimeout(() => {
        board = plannedMove.next;
        const newCell = addRandomTile();
        renderTiles(newCell, plannedMove.mergeCells, true);
        animating = false;
        updateState();
      }, moveDuration);
    }

    function updateState() {
      if (!won && board.some((row) => row.includes(2048))) {
        won = true;
        showMessage("Access Granted", "You reached 2048. Keep pushing the grid or start fresh.", false);
        return;
      }

      if (!canMove()) {
        gameOver = true;
        showMessage("Game Over", "No more moves remain in the grid.", true);
      }
    }

    function canMove() {
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          if (board[row][col] === 0) return true;
          if (col < size - 1 && board[row][col] === board[row][col + 1]) return true;
          if (row < size - 1 && board[row][col] === board[row + 1][col]) return true;
        }
      }
      return false;
    }

    function showMessage(title, text, restartOnly) {
      messageTitle.textContent = title;
      messageText.textContent = text;
      messageButton.textContent = restartOnly ? "Restart" : "Continue";
      messageElement.classList.add("show");
    }

    function continueGame() {
      messageElement.classList.remove("show");
    }

    document.addEventListener("keydown", (event) => {
      const keyMap = {
        ArrowUp: "up",
        ArrowRight: "right",
        ArrowDown: "down",
        ArrowLeft: "left",
        w: "up",
        d: "right",
        s: "down",
        a: "left",
        W: "up",
        D: "right",
        S: "down",
        A: "left"
      };

      const direction = keyMap[event.key];
      if (!direction) return;
      event.preventDefault();
      move(direction);
    });

    boardElement.addEventListener("pointerdown", (event) => {
      touchStart = { x: event.clientX, y: event.clientY };
    });

    boardElement.addEventListener("pointerup", (event) => {
      if (!touchStart) return;

      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      touchStart = null;

      if (Math.max(absX, absY) < 24) return;
      move(absX > absY ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });

    newGameButton.addEventListener("click", startGame);
    keepPlayingButton.addEventListener("click", continueGame);
    messageButton.addEventListener("click", () => {
      if (gameOver) {
        startGame();
      } else {
        continueGame();
      }
    });

    startGame();
  </script>
</body>
</html>
