<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridline Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --charcoal: #07100b;
      --panel: rgba(4, 20, 12, 0.88);
      --neon: #39ff88;
      --neon-mid: rgba(57, 255, 136, 0.52);
      --text: #e8fff2;
      --muted: #8ccfaa;
      --radius: 8px;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(57, 255, 136, 0.11), transparent 34%),
        linear-gradient(180deg, var(--charcoal) 0%, var(--bg) 42%, #000 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    main {
      width: min(100%, 680px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6.6rem);
      line-height: 0.9;
      letter-spacing: 0;
      color: #f2fff7;
      text-shadow:
        0 0 8px rgba(57, 255, 136, 0.75),
        0 0 28px rgba(57, 255, 136, 0.45),
        0 0 64px rgba(57, 255, 136, 0.22);
    }

    p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin: 18px auto 24px;
      max-width: 32rem;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    a {
      border: 1px solid var(--neon-mid);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(57, 255, 136, 0.14), rgba(2, 10, 6, 0.7));
      box-shadow: inset 0 0 18px rgba(57, 255, 136, 0.08), 0 0 20px rgba(57, 255, 136, 0.1);
      color: var(--text);
      display: grid;
      min-height: 126px;
      padding: 20px;
      place-items: center;
      text-decoration: none;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    a:hover,
    a:focus-visible {
      background: rgba(57, 255, 136, 0.15);
      box-shadow: 0 0 26px rgba(57, 255, 136, 0.34), inset 0 0 16px rgba(57, 255, 136, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    strong {
      display: block;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    span {
      color: var(--muted);
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-top: 8px;
      text-transform: uppercase;
    }

    @media (max-width: 560px) {
      .games {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gridline Arcade</h1>
    <p>Small browser games with the same dark neon grid style. Pick a game and play directly in the browser.</p>
    <div class="games" aria-label="Game list">
      <a href="2048.html">
        <span>
          <strong>2048</strong>
          Gridline puzzle
        </span>
      </a>
      <a href="star-swarm.html">
        <span>
          <strong>Star Swarm</strong>
          Arcade shooter
        </span>
      </a>
    </div>
  </main>
</body>
</html>
